name: Public receipt verification (offline)
on:
  push:
    paths:
      - 'receipts/paired-fleet-disagreement/**'
      - '.github/workflows/receipt-check.yml'
  pull_request:
    paths:
      - 'receipts/paired-fleet-disagreement/**'
      - '.github/workflows/receipt-check.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline tests
        working-directory: receipts/paired-fleet-disagreement
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Produce result
        working-directory: receipts/paired-fleet-disagreement
        run: python3 reproduce.py > /tmp/receipt-result.json
      - name: Compare against reference JSON
        working-directory: receipts/paired-fleet-disagreement
        run: python3 -c "import json; assert json.load(open('/tmp/receipt-result.json')) == json.load(open('RESULT.json'))"
